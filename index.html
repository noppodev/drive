<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NoppoDrive | NoppoStudio</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Noto+Sans+JP:wght@300;400;500;700;900&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #2563eb;
            --bg-main: #fcfdfe;
            --sidebar-width: 280px;
        }
        body { 
            font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif; 
            background-color: var(--bg-main); 
            color: #0f172a; 
            overflow: hidden; 
            -webkit-tap-highlight-color: transparent;
        }
        [v-cloak] { display: none; }
        
        .bg-orb {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -1;
            opacity: 0.15;
            pointer-events: none;
        }
        .orb-1 { background: #3b82f6; top: -200px; right: -100px; }
        .orb-2 { background: #8b5cf6; bottom: -200px; left: -100px; }

        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        .dark-glass { background: rgba(10, 15, 30, 0.85); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); }
        
        .page-enter { animation: reveal 0.6s cubic-bezier(0.23, 1, 0.32, 1); }
        @keyframes reveal { 
            from { opacity: 0; transform: translateY(15px) scale(0.98); } 
            to { opacity: 1; transform: translateY(0) scale(1); } 
        }
        
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }

        .item-card { 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(226, 232, 240, 0.6);
        }
        .item-card:hover { 
            transform: translateY(-6px); 
            background: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.05);
        }
        .item-selected { 
            border-color: var(--primary) !important; 
            background: #eff6ff !important; 
        }

        .font-logo { font-family: 'Space Grotesk', sans-serif; letter-spacing: -0.05em; }
        
        @media (max-width: 1023px) {
            .sidebar-desktop { display: none !important; }
            .mobile-padding { padding-bottom: 120px; } 
        }

        .loader {
            width: 24px; height: 24px;
            border: 2px solid #e2e8f0;
            border-top: 2px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .btn-hover { transition: all 0.2s ease; }
        .btn-hover:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-hover:active { transform: translateY(1px); }
    </style>
</head>
<body class="select-none">

    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <div id="app" v-cloak class="flex h-screen w-full relative">

        <!-- Login UI -->
        <div v-if="!user" class="fixed inset-0 z-[2000] bg-white flex flex-col items-center justify-center p-8 text-center">
            <div class="w-24 h-24 bg-blue-600 rounded-[2.8rem] flex items-center justify-center shadow-[0_20px_50px_rgba(37,99,235,0.3)] mb-12 animate-bounce">
                <i data-lucide="cloud" class="w-12 h-12 text-white"></i>
            </div>
            <h1 class="text-5xl font-black mb-4 font-logo text-slate-900">NoppoDrive</h1>
            <p class="text-slate-400 font-medium mb-12 max-w-xs leading-relaxed">Studioクオリティの洗練された<br>クリエイティブストレージ</p>
            
            <div v-if="authLoading" class="flex flex-col items-center gap-4">
                <div class="loader"></div>
                <p class="text-xs font-bold text-slate-400">認証情報を同期中...</p>
            </div>
            <button v-else @click="goToLogin" class="w-full max-w-xs py-5 bg-slate-950 text-white rounded-[1.8rem] font-bold btn-hover shadow-2xl flex items-center justify-center gap-3 text-lg">
                <i data-lucide="user" class="w-6 h-6"></i>
                NoppoAuth でログイン
            </button>
        </div>

        <template v-if="user">
            <!-- Sidebar -->
            <aside class="sidebar-desktop w-[var(--sidebar-width)] h-full glass border-r border-slate-200/50 flex flex-col z-20">
                <div class="p-8">
                    <div class="flex items-center gap-3 mb-12">
                        <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-blue-700 rounded-2xl flex items-center justify-center text-white shadow-lg">
                            <i data-lucide="box" class="w-5 h-5"></i>
                        </div>
                        <span class="font-black text-2xl font-logo">NoppoDrive</span>
                    </div>

                    <button @click="triggerUpload" class="w-full bg-blue-600 text-white py-4 rounded-[1.2rem] font-bold flex items-center justify-center gap-2 btn-hover shadow-xl mb-10">
                        <i data-lucide="plus" class="w-5 h-5"></i>
                        新規追加
                    </button>

                    <nav class="space-y-2">
                        <button v-for="nav in navItems" :key="nav.id" @click="currentTab = nav.id"
                            :class="['w-full flex items-center gap-4 px-5 py-3.5 rounded-[1.1rem] text-[14px] font-bold transition-all', currentTab === nav.id ? 'bg-slate-900 text-white shadow-xl' : 'text-slate-400 hover:bg-slate-100/50 hover:text-slate-900']">
                            <i :data-lucide="nav.icon" class="w-5 h-5"></i>
                            {{ nav.label }}
                        </button>
                    </nav>
                </div>

                <div class="mt-auto p-8">
                    <div class="flex items-center gap-3 p-3 bg-white border border-slate-100 rounded-[1.4rem] shadow-sm">
                        <img :src="user.avatar || 'https://ui-avatars.com/api/?name=' + user.userId" class="w-11 h-11 rounded-[1rem] object-cover bg-slate-200">
                        <div class="flex-1 min-w-0">
                            <p class="text-[13px] font-black text-slate-900 truncate">{{ user.userId }}</p>
                            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-tighter">Authorized</p>
                        </div>
                        <button @click="logout" class="p-2 text-slate-300 hover:text-rose-500 transition-colors">
                            <i data-lucide="log-out" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            </aside>

            <!-- Main Content -->
            <main class="flex-1 flex flex-col min-w-0 relative mobile-padding overflow-hidden">
                <header class="h-24 lg:h-32 px-6 lg:px-12 flex items-center justify-between z-10 shrink-0">
                    <div class="flex items-center gap-8 flex-1">
                        <h2 class="hidden lg:block text-3xl font-black text-slate-900 tracking-tighter">{{ currentNavLabel }}</h2>
                        <div class="lg:hidden flex items-center gap-2">
                            <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white">
                                <i data-lucide="box" class="w-4 h-4"></i>
                            </div>
                            <span class="font-black text-xl font-logo">Noppo</span>
                        </div>
                        <div class="flex-1 max-w-xl relative group">
                            <i data-lucide="search" class="absolute left-6 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-300 group-focus-within:text-blue-600 transition-colors"></i>
                            <input v-model="searchQuery" type="text" placeholder="ファイルを検索..." class="w-full bg-white/60 border border-slate-200 focus:border-blue-500 focus:bg-white rounded-[1.4rem] py-4 pl-14 pr-6 text-sm font-semibold outline-none transition-all shadow-sm">
                        </div>
                    </div>
                </header>

                <div class="flex-1 overflow-y-auto px-6 lg:px-12 pb-24 custom-scroll">
                    <!-- Loading -->
                    <div v-if="loading" class="flex flex-col items-center justify-center py-48 gap-5">
                        <div class="loader"></div>
                        <p class="text-[10px] font-black text-slate-400 tracking-[0.2em] uppercase">Syncing...</p>
                    </div>

                    <!-- Empty -->
                    <div v-else-if="filteredItems.length === 0" class="flex flex-col items-center justify-center py-40 page-enter">
                        <div class="w-28 h-28 bg-white rounded-[3rem] shadow-xl flex items-center justify-center mb-8 border border-slate-100">
                            <i data-lucide="cloud-off" class="w-12 h-12 text-slate-200"></i>
                        </div>
                        <p class="font-black text-slate-400 text-xl tracking-tight">ファイルがありません</p>
                    </div>

                    <!-- Items Grid -->
                    <div v-else class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-7 gap-6 lg:gap-8">
                        <div v-for="item in filteredItems" :key="item.id" 
                            @click="handleItemClick(item)"
                            :class="['item-card rounded-[2rem] p-4 flex flex-col items-center cursor-pointer page-enter relative group', isSelected(item) ? 'item-selected' : '']">
                            
                            <div class="w-full aspect-square mb-4 flex items-center justify-center overflow-hidden rounded-[1.4rem] bg-slate-50/50 relative">
                                <img v-if="isImage(item.type) && item.url" :src="item.url" class="w-full h-full object-cover">
                                <div v-else :class="['w-12 h-12 rounded-2xl flex items-center justify-center', getStyle(item.type).bg]">
                                    <i :data-lucide="getStyle(item.type).icon" :class="['w-6 h-6', getStyle(item.type).text]"></i>
                                </div>
                                <div v-if="item.processing" class="absolute inset-0 glass flex items-center justify-center">
                                    <div class="loader scale-75"></div>
                                </div>
                            </div>

                            <div class="w-full text-center px-1">
                                <p class="text-[13px] font-bold text-slate-800 truncate">{{ item.name }}</p>
                                <p class="text-[9px] text-slate-400 font-bold uppercase tracking-wider mt-1.5">{{ formatSize(item.size) }}</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Floating Btn -->
                <button @click="triggerUpload" class="lg:hidden fixed bottom-32 right-8 w-16 h-16 bg-blue-600 text-white rounded-[1.8rem] flex items-center justify-center shadow-2xl z-30 btn-hover">
                    <i data-lucide="plus" class="w-8 h-8"></i>
                </button>

                <!-- Mobile Nav -->
                <nav class="lg:hidden fixed bottom-8 left-6 right-6 h-20 glass rounded-[2.2rem] border border-slate-200/50 flex items-center justify-around px-4 z-40 shadow-2xl">
                    <button v-for="nav in navItems" :key="nav.id" @click="currentTab = nav.id"
                        :class="['flex flex-col items-center gap-1 transition-all', currentTab === nav.id ? 'text-blue-600 scale-110' : 'text-slate-300']">
                        <i :data-lucide="nav.icon" class="w-6 h-6"></i>
                        <span class="text-[9px] font-black uppercase">{{ nav.label }}</span>
                    </button>
                    <button @click="logout" class="flex flex-col items-center gap-1 text-slate-300">
                        <i data-lucide="log-out" class="w-6 h-6"></i>
                        <span class="text-[9px] font-black uppercase">Exit</span>
                    </button>
                </nav>
            </main>

            <!-- Preview UI -->
            <div v-if="previewItem" class="fixed inset-0 z-[1000] dark-glass flex flex-col page-enter">
                <header class="h-24 px-8 flex items-center justify-between text-white border-b border-white/5">
                    <div class="flex items-center gap-4">
                        <button @click="previewItem = null" class="w-10 h-10 flex items-center justify-center bg-white/10 rounded-full">
                            <i data-lucide="chevron-left" class="w-6 h-6"></i>
                        </button>
                        <p class="font-black truncate max-w-xs">{{ previewItem.name }}</p>
                    </div>
                    <button v-if="previewItem.url" @click="downloadFile(previewItem)" class="p-4 bg-white text-black rounded-2xl font-bold flex items-center gap-2 btn-hover">
                        <i data-lucide="download" class="w-5 h-5"></i> 保存
                    </button>
                </header>
                <div class="flex-1 flex items-center justify-center p-8">
                    <img v-if="isImage(previewItem.type) && previewItem.url" :src="previewItem.url" class="max-w-full max-h-full object-contain rounded-3xl shadow-2xl">
                    <div v-else class="text-center">
                        <div :class="['w-32 h-32 rounded-[3rem] flex items-center justify-center mx-auto mb-10 shadow-2xl', getStyle(previewItem.type).bg]">
                            <i :data-lucide="getStyle(previewItem.type).icon" :class="['w-14 h-14', getStyle(previewItem.type).text]"></i>
                        </div>
                        <h2 class="text-3xl font-black text-white mb-4">{{ previewItem.name }}</h2>
                        <button @click="previewItem = null" class="px-12 py-5 bg-white/10 rounded-[1.6rem] font-bold text-white">閉じる</button>
                    </div>
                </div>
            </div>

            <transition name="fade">
                <div v-if="statusMessage" class="fixed top-10 left-1/2 -translate-x-1/2 dark-glass text-white px-8 py-4 rounded-[1.6rem] shadow-2xl z-[1500] flex items-center gap-4">
                    <div class="loader scale-75 border-white/20"></div>
                    <span class="text-xs font-black uppercase tracking-widest">{{ statusMessage }}</span>
                </div>
            </transition>

            <input type="file" ref="fileInput" class="hidden" @change="handleFileUpload" multiple>
        </template>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
        import { createApp, ref, computed, onMounted, nextTick, watch } from "https://unpkg.com/vue@3/dist/vue.esm-browser.prod.js";

        const AUTH_WORKER_URL = "https://noppo-auth.noppo5319.workers.dev";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2YXZhc3JkeGd1cWtpaWdjeGtsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc0MTk5ODcsImV4cCI6MjA4Mjk5NTk4N30.CVq3lyRbxek7Ejs4tP5sN9-0JNEXSLtCsC2Pj-skFFQ";
        const CLOUDINARY_CLOUD_NAME = "daiywtxmw";
        const CLOUDINARY_UPLOAD_PRESET = "noppo_preset";
        
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyAwe9BsUFXA4MdzYYuekNsLo320MHqfXww",
            authDomain: "tribal-bonsai-470002-u0.firebaseapp.com",
            projectId: "tribal-bonsai-470002-u0",
            storageBucket: "tribal-bonsai-470002-u0.firebasestorage.app",
            appId: "1:189688737908:web:f3281eab70669b5796e121"
        };
        const APP_ID = typeof __app_id !== 'undefined' ? __app_id : 'noppo-drive-ultimate';

        createApp({
            setup() {
                const user = ref(null);
                const items = ref([]);
                const loading = ref(true);
                const authLoading = ref(true);
                const currentTab = ref('all');
                const searchQuery = ref('');
                const selectedItem = ref(null);
                const previewItem = ref(null);
                const fileInput = ref(null);
                const statusMessage = ref("");
                let unsubscribeItems = null;

                const navItems = [
                    { id: 'all', label: 'All Files', icon: 'layers' },
                    { id: 'starred', label: 'Starred', icon: 'star' },
                    { id: 'trash', label: 'Trash', icon: 'trash-2' }
                ];

                const app = initializeApp(firebaseConfig);
                const db = getFirestore(app);
                const auth = getAuth(app);

                // NoppoAuth Ticket Handling
                async function loadNoppoUser() {
                    const params = new URLSearchParams(window.location.search);
                    const ticket = params.get('ticket');
                    try {
                        const url = ticket 
                            ? `${AUTH_WORKER_URL}/auth/v1/user?ticket=${ticket}`
                            : `${AUTH_WORKER_URL}/auth/v1/user`;
                        const res = await fetch(url, { headers: { "apikey": SUPABASE_KEY } });
                        if (res.ok) {
                            const data = await res.json();
                            const profile = {
                                userId: data.user_metadata?.display_name || data.email?.split('@')[0] || 'Unknown User',
                                avatar: data.user_metadata?.avatar_url,
                                email: data.email,
                                uid: data.id
                            };
                            if (ticket) {
                                window.history.replaceState({}, document.title, window.location.origin + window.location.pathname);
                            }
                            localStorage.setItem('noppo_user_profile', JSON.stringify(profile));
                            return profile;
                        }
                    } catch (e) { console.error(e); }
                    const cached = localStorage.getItem('noppo_user_profile');
                    return cached ? JSON.parse(cached) : null;
                }

                const filteredItems = computed(() => {
                    let res = items.value;
                    if (currentTab.value === 'starred') res = res.filter(i => i.is_starred && !i.is_deleted);
                    else if (currentTab.value === 'trash') res = res.filter(i => i.is_deleted);
                    else res = res.filter(i => !i.is_deleted);
                    if (searchQuery.value) {
                        const q = searchQuery.value.toLowerCase();
                        res = res.filter(i => i.name.toLowerCase().includes(q));
                    }
                    return res;
                });

                watch([currentTab, filteredItems, previewItem, loading, user], () => {
                    nextTick(() => lucide.createIcons());
                });

                // Firebase Initialization Pattern (RULE 3 - AUTH FIRST)
                onMounted(async () => {
                    // 1. プロファイル読み込み
                    user.value = await loadNoppoUser();
                    authLoading.value = false;

                    // 2. 認証処理 (カスタムトークン優先、なければ匿名)
                    try {
                        console.log("Starting Firebase Auth...");
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (err) {
                        console.error("Auth Failure:", err);
                        // 失敗した場合のフォールバックとして匿名認証を試みる
                        try { await signInAnonymously(auth); } catch(e) {}
                    }

                    // 3. 認証状態が確定してからリスナーを開始
                    onAuthStateChanged(auth, (fbUser) => {
                        if (fbUser) {
                            console.log("Firebase Auth Verified:", fbUser.uid);
                            startDataListener();
                        } else {
                            console.warn("User logged out or not authenticated.");
                            if (unsubscribeItems) unsubscribeItems();
                            loading.value = false;
                        }
                    });
                });

                function startDataListener() {
                    // 重複実行を防止
                    if (unsubscribeItems) unsubscribeItems();
                    
                    loading.value = true;
                    // RULE 1: /artifacts/{appId}/public/data/{collection}
                    const itemsCollection = collection(db, 'artifacts', APP_ID, 'public', 'data', 'items');
                    
                    // RULE 2: シンプルなクエリで取得し、メモリ内でソート
                    unsubscribeItems = onSnapshot(itemsCollection, (snap) => {
                        items.value = snap.docs.map(d => ({ id: d.id, ...d.data() }))
                                          .sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
                        loading.value = false;
                        console.log("Data Sync Completed.");
                    }, (err) => {
                        console.error("Firestore Listener Error:", err);
                        loading.value = false;
                    });
                }

                const handleFileUpload = async (e) => {
                    if (!auth.currentUser) return;
                    
                    const files = Array.from(e.target.files);
                    for (const file of files) {
                        statusMessage.value = `UP: ${file.name}`;
                        try {
                            const itemsCollection = collection(db, 'artifacts', APP_ID, 'public', 'data', 'items');
                            const docRef = await addDoc(itemsCollection, {
                                name: file.name,
                                size: file.size,
                                type: file.type || 'application/octet-stream',
                                url: "",
                                is_deleted: false,
                                is_starred: false,
                                processing: true,
                                createdAt: serverTimestamp(),
                                ownerId: user.value?.uid || auth.currentUser.uid
                            });

                            const formData = new FormData();
                            formData.append('file', file);
                            formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
                            const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`, { method: 'POST', body: formData });
                            const result = await res.json();
                            
                            const fileDoc = doc(db, 'artifacts', APP_ID, 'public', 'data', 'items', docRef.id);
                            await updateDoc(fileDoc, { url: result.secure_url, processing: false });
                            statusMessage.value = "";
                        } catch (err) { 
                            console.error("Upload Error:", err);
                            statusMessage.value = "ERROR"; 
                        }
                    }
                };

                const getStyle = (t) => {
                    if (t?.includes('pdf')) return { bg: 'bg-rose-100', text: 'text-rose-600', icon: 'file-text' };
                    if (t?.includes('zip')) return { bg: 'bg-amber-100', text: 'text-amber-600', icon: 'archive' };
                    return { bg: 'bg-blue-100', text: 'text-blue-600', icon: 'file' };
                };

                return {
                    user, items, filteredItems, currentTab, searchQuery, selectedItem, previewItem, loading, authLoading,
                    statusMessage, fileInput, navItems, currentNavLabel: computed(() => navItems.find(n => n.id === currentTab.value)?.label),
                    goToLogin: () => {
                        const currentUrl = encodeURIComponent(window.location.href);
                        window.location.href = `${AUTH_WORKER_URL}?redirect=${currentUrl}`;
                    },
                    logout: () => {
                        localStorage.removeItem('noppo_user_profile');
                        const currentUrl = encodeURIComponent(window.location.href);
                        window.location.href = `${AUTH_WORKER_URL}/logout?redirect=${currentUrl}`;
                    },
                    triggerUpload: () => fileInput.value.click(),
                    handleFileUpload, 
                    handleItemClick: (item) => previewItem.value = item,
                    isSelected: (item) => selectedItem.value?.id === item.id,
                    isImage: (t) => t?.startsWith('image/'),
                    formatSize: (b) => b ? (b/1024/1024).toFixed(1) + ' MB' : '0 B',
                    downloadFile: (item) => window.open(item.url, '_blank'),
                    getStyle
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
