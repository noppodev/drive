<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NoppoDrive | NoppoStudio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Noto+Sans+JP:wght@300;400;500;700;900&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --bg-main: #fcfdfe;
            --sidebar-width: 280px;
        }
        body { 
            font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif; 
            background-color: var(--bg-main); 
            color: #0f172a; 
            overflow: hidden; 
            -webkit-tap-highlight-color: transparent;
        }
        [v-cloak] { display: none; }
        
        .bg-orb {
            position: fixed;
            width: 600px; height: 600px;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -1;
            opacity: 0.15;
            pointer-events: none;
        }
        .orb-1 { background: #3b82f6; top: -200px; right: -100px; }
        .orb-2 { background: #8b5cf6; bottom: -200px; left: -100px; }

        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        .dark-glass { background: rgba(10, 15, 30, 0.85); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); }
        
        .page-enter { animation: reveal 0.4s cubic-bezier(0.23, 1, 0.32, 1); }
        @keyframes reveal { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }

        .item-card { 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(226, 232, 240, 0.6);
        }
        .item-card:hover { 
            transform: translateY(-4px); 
            background: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.05);
        }

        .font-logo { font-family: 'Space Grotesk', sans-serif; letter-spacing: -0.05em; }
        
        @media (max-width: 1023px) {
            .sidebar-desktop { display: none !important; }
            .mobile-padding { padding-bottom: 120px; } 
        }

        .loader {
            width: 24px; height: 24px;
            border: 2px solid #e2e8f0;
            border-top: 2px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .btn-hover { transition: all 0.2s ease; }
        .btn-hover:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-hover:active { transform: translateY(1px); }
        
        .fade-enter-active, .fade-leave-active { transition: opacity 0.3s; }
        .fade-enter-from, .fade-leave-to { opacity: 0; }

        /* Drag Overlay */
        .drag-overlay {
            position: fixed;
            inset: 0;
            z-index: 5000;
            background: rgba(37, 99, 235, 0.1);
            backdrop-filter: blur(4px);
            border: 4px dashed var(--primary);
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s;
        }

        /* Context Menu */
        .context-menu {
            position: fixed;
            z-index: 6000;
            min-width: 200px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            border-radius: 1.2rem;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.15);
            padding: 0.5rem;
            animation: context-reveal 0.2s ease-out;
        }
        @keyframes context-reveal {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body class="select-none" @contextmenu.prevent>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <div id="app" v-cloak 
        class="flex h-screen w-full relative"
        @dragover.prevent="onDragOver"
        @dragleave.prevent="onDragLeave"
        @drop.prevent="onDrop"
        @click="closeContextMenu">

        <!-- Drag & Drop Overlay -->
        <div v-if="isDragging" class="drag-overlay">
            <div class="text-center animate-bounce">
                <i data-lucide="cloud-upload" class="w-20 h-20 text-blue-600 mx-auto mb-4"></i>
                <p class="text-2xl font-black text-blue-600">ドロップしてアップロード</p>
            </div>
        </div>

        <!-- Context Menu -->
        <div v-if="contextMenu.show" 
            class="context-menu" 
            :style="{ top: contextMenu.y + 'px', left: contextMenu.x + 'px' }">
            <template v-if="contextMenu.item">
                <!-- ゴミ箱の中ではない場合 -->
                <template v-if="!contextMenu.item.is_deleted">
                    <button @click="handleItemClick(contextMenu.item)" class="w-full flex items-center gap-3 p-3 hover:bg-slate-100 rounded-xl transition-colors text-sm font-bold text-slate-700">
                        <i data-lucide="eye" class="w-4 h-4"></i> 表示
                    </button>
                    <button @click="toggleStar(contextMenu.item)" class="w-full flex items-center gap-3 p-3 hover:bg-slate-100 rounded-xl transition-colors text-sm font-bold text-slate-700">
                        <i data-lucide="star" class="w-4 h-4" :class="contextMenu.item.is_starred ? 'text-amber-500 fill-amber-500' : ''"></i> 
                        {{ contextMenu.item.is_starred ? 'お気に入り解除' : 'お気に入りに追加' }}
                    </button>
                    <button v-if="contextMenu.item.type !== 'folder'" @click="downloadFile(contextMenu.item)" class="w-full flex items-center gap-3 p-3 hover:bg-slate-100 rounded-xl transition-colors text-sm font-bold text-slate-700">
                        <i data-lucide="download" class="w-4 h-4"></i> ダウンロード
                    </button>
                    <div class="h-px bg-slate-100 my-1"></div>
                    <button @click="moveToTrash(contextMenu.item)" class="w-full flex items-center gap-3 p-3 hover:bg-rose-50 rounded-xl transition-colors text-sm font-bold text-rose-500">
                        <i data-lucide="trash-2" class="w-4 h-4"></i> ゴミ箱へ
                    </button>
                </template>
                <!-- ゴミ箱の中にいる場合 -->
                <template v-else>
                    <button @click="restoreFromTrash(contextMenu.item)" class="w-full flex items-center gap-3 p-3 hover:bg-slate-100 rounded-xl transition-colors text-sm font-bold text-slate-700">
                        <i data-lucide="rotate-ccw" class="w-4 h-4"></i> 元に戻す
                    </button>
                    <div class="h-px bg-slate-100 my-1"></div>
                    <button @click="permanentlyDelete(contextMenu.item)" class="w-full flex items-center gap-3 p-3 hover:bg-rose-600 hover:text-white rounded-xl transition-colors text-sm font-bold text-rose-600">
                        <i data-lucide="alert-triangle" class="w-4 h-4"></i> 完全に削除
                    </button>
                </template>
            </template>
            <template v-else>
                <button @click="createFolderPrompt" class="w-full flex items-center gap-3 p-3 hover:bg-slate-100 rounded-xl transition-colors text-sm font-bold text-slate-700">
                    <i data-lucide="folder-plus" class="w-4 h-4 text-blue-500"></i> 新規フォルダ
                </button>
                <button @click="triggerUpload('file')" class="w-full flex items-center gap-3 p-3 hover:bg-slate-100 rounded-xl transition-colors text-sm font-bold text-slate-700">
                    <i data-lucide="file-up" class="w-4 h-4 text-blue-500"></i> ファイルをアップロード
                </button>
                <div class="h-px bg-slate-100 my-1"></div>
                <button @click="window.location.reload()" class="w-full flex items-center gap-3 p-3 hover:bg-slate-100 rounded-xl transition-colors text-sm font-bold text-slate-700">
                    <i data-lucide="refresh-cw" class="w-4 h-4"></i> 再読み込み
                </button>
            </template>
        </div>

        <!-- Auth View -->
        <div v-if="!user" class="fixed inset-0 z-[2000] bg-white flex flex-col items-center justify-center p-8 text-center">
            <div class="w-24 h-24 bg-blue-600 rounded-[2.8rem] flex items-center justify-center shadow-[0_20px_50px_rgba(37,99,235,0.3)] mb-12 animate-bounce">
                <i data-lucide="cloud" class="w-12 h-12 text-white"></i>
            </div>
            <h1 class="text-5xl font-black mb-4 font-logo text-slate-900">NoppoDrive</h1>
            <p class="text-slate-400 font-medium mb-12 max-w-xs leading-relaxed">Studioクオリティの洗練された<br>クリエイティブストレージ</p>
            
            <div v-if="authLoading" class="flex flex-col items-center gap-4">
                <div class="loader"></div>
                <p class="text-xs font-bold text-slate-400">認証情報を同期中...</p>
            </div>
            <button v-else @click="goToLogin" class="w-full max-w-xs py-5 bg-slate-950 text-white rounded-[1.8rem] font-bold btn-hover shadow-2xl flex items-center justify-center gap-3 text-lg">
                <i data-lucide="user" class="w-6 h-6"></i>
                NoppoAuth でログイン
            </button>
        </div>

        <template v-if="user">
            <!-- Sidebar -->
            <aside class="sidebar-desktop w-[var(--sidebar-width)] h-full glass border-r border-slate-200/50 flex flex-col z-20">
                <div class="p-8">
                    <div class="flex items-center gap-3 mb-10">
                        <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-blue-700 rounded-2xl flex items-center justify-center text-white shadow-lg">
                            <i data-lucide="box" class="w-5 h-5"></i>
                        </div>
                        <span class="font-black text-2xl font-logo">NoppoDrive</span>
                    </div>

                    <div class="relative mb-8">
                        <button @click.stop="showAddMenu = !showAddMenu" class="w-full bg-blue-600 text-white py-4 rounded-[1.2rem] font-bold flex items-center justify-center gap-2 btn-hover shadow-xl">
                            <i data-lucide="plus" class="w-5 h-5"></i>
                            新規作成
                        </button>
                        <!-- Add Menu Dropdown -->
                        <div v-if="showAddMenu" class="absolute top-full left-0 w-full mt-2 glass border border-slate-200 rounded-2xl shadow-2xl p-2 z-50 overflow-hidden page-enter">
                            <button @click="triggerUpload('file')" class="w-full flex items-center gap-3 p-3 hover:bg-slate-100 rounded-xl transition-colors text-sm font-bold text-slate-700">
                                <i data-lucide="file-up" class="w-4 h-4"></i> ファイル
                            </button>
                            <button @click="triggerUpload('folder')" class="w-full flex items-center gap-3 p-3 hover:bg-slate-100 rounded-xl transition-colors text-sm font-bold text-slate-700">
                                <i data-lucide="folder-up" class="w-4 h-4"></i> フォルダ
                            </button>
                            <div class="h-px bg-slate-100 my-1"></div>
                            <button @click="createFolderPrompt" class="w-full flex items-center gap-3 p-3 hover:bg-slate-100 rounded-xl transition-colors text-sm font-bold text-blue-600">
                                <i data-lucide="folder-plus" class="w-4 h-4"></i> 新しいフォルダ
                            </button>
                        </div>
                    </div>

                    <nav class="space-y-2">
                        <button v-for="nav in navItems" :key="nav.id" @click="currentTab = nav.id; currentFolder = null"
                            :class="['w-full flex items-center gap-4 px-5 py-3.5 rounded-[1.1rem] text-[14px] font-bold transition-all', (currentTab === nav.id && !currentFolder) ? 'bg-slate-900 text-white shadow-xl' : 'text-slate-400 hover:bg-slate-100/50 hover:text-slate-900']">
                            <i :data-lucide="nav.icon" class="w-5 h-5"></i>
                            {{ nav.label }}
                        </button>
                    </nav>
                </div>

                <div class="mt-auto p-8">
                    <div class="flex items-center gap-3 p-3 bg-white border border-slate-100 rounded-[1.4rem] shadow-sm">
                        <img :src="user.avatar || 'https://ui-avatars.com/api/?name=' + user.userId" class="w-11 h-11 rounded-[1rem] object-cover bg-slate-200">
                        <div class="flex-1 min-w-0">
                            <p class="text-[13px] font-black text-slate-900 truncate">{{ user.userId }}</p>
                            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-tighter">Authorized</p>
                        </div>
                        <button @click="logout" class="p-2 text-slate-300 hover:text-rose-500 transition-colors">
                            <i data-lucide="log-out" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            </aside>

            <!-- Main Content -->
            <main class="flex-1 flex flex-col min-w-0 relative mobile-padding overflow-hidden" @contextmenu.prevent="onEmptyContextMenu">
                <header class="h-24 lg:h-32 px-6 lg:px-12 flex flex-col justify-center z-10 shrink-0" @contextmenu.stop>
                    <div class="flex items-center justify-between mb-2">
                        <div class="flex items-center gap-4 min-w-0">
                            <div class="flex items-center gap-2 text-slate-400 overflow-x-auto whitespace-nowrap custom-scroll pb-1 pr-4">
                                <button @click="currentFolder = null" class="hover:text-slate-900 transition-colors shrink-0">
                                    <i data-lucide="home" class="w-4 h-4"></i>
                                </button>
                                <template v-for="folder in folderPath" :key="folder.id">
                                    <i data-lucide="chevron-right" class="w-3 h-3 shrink-0"></i>
                                    <button @click="currentFolder = folder" class="font-bold text-sm hover:text-slate-900 transition-colors shrink-0 max-w-[100px] truncate">
                                        {{ folder.name }}
                                    </button>
                                </template>
                                <template v-if="currentFolder">
                                    <i data-lucide="chevron-right" class="w-3 h-3 shrink-0"></i>
                                    <span class="font-black text-sm text-slate-900 shrink-0 max-w-[150px] truncate">{{ currentFolder.name }}</span>
                                </template>
                            </div>
                        </div>
                        <div class="flex-1 max-w-sm ml-4 relative group hidden md:block">
                            <i data-lucide="search" class="absolute left-6 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-300 group-focus-within:text-blue-600 transition-colors"></i>
                            <input v-model="searchQuery" type="text" placeholder="ファイルを検索..." class="w-full bg-white/60 border border-slate-200 focus:border-blue-500 focus:bg-white rounded-[1.4rem] py-3 pl-14 pr-6 text-sm font-semibold outline-none transition-all shadow-sm">
                        </div>
                    </div>
                    <h2 class="text-2xl font-black text-slate-900 tracking-tighter">{{ currentDisplayTitle }}</h2>
                </header>

                <div class="flex-1 overflow-y-auto px-6 lg:px-12 pb-24 custom-scroll">
                    <div v-if="loading" class="flex flex-col items-center justify-center py-48 gap-5">
                        <div class="loader"></div>
                        <p class="text-[10px] font-black text-slate-400 tracking-[0.2em] uppercase">Drive Syncing...</p>
                    </div>

                    <div v-else-if="filteredItems.length === 0" class="flex flex-col items-center justify-center py-40 page-enter">
                        <div class="w-28 h-28 bg-white rounded-[3rem] shadow-xl flex items-center justify-center mb-8 border border-slate-100">
                            <i data-lucide="folder-open" class="w-12 h-12 text-slate-200"></i>
                        </div>
                        <p class="font-black text-slate-400 text-xl tracking-tight">ここにはまだ何もありません</p>
                    </div>

                    <div v-else class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 2xl:grid-cols-8 gap-4 lg:gap-6">
                        <div v-for="item in filteredItems" :key="item.id" 
                            @click="handleItemClick(item)"
                            @contextmenu.prevent.stop="onItemContextMenu($event, item)"
                            class="item-card rounded-[1.8rem] p-3 flex flex-col items-center cursor-pointer page-enter relative group">
                            
                            <div class="w-full aspect-square mb-3 flex items-center justify-center overflow-hidden rounded-[1.2rem] bg-slate-50 relative">
                                <div v-if="item.type === 'folder'" class="w-full h-full flex items-center justify-center">
                                    <i data-lucide="folder" class="w-12 h-12 text-blue-500 fill-blue-500/10"></i>
                                </div>
                                <img v-else-if="isImage(item.type) && item.url" :src="item.url" class="w-full h-full object-cover">
                                <div v-else :class="['w-10 h-10 rounded-xl flex items-center justify-center', getStyle(item.type).bg]">
                                    <i :data-lucide="getStyle(item.type).icon" :class="['w-5 h-5', getStyle(item.type).text]"></i>
                                </div>
                                <div v-if="item.processing" class="absolute inset-0 glass flex items-center justify-center">
                                    <div class="loader scale-75"></div>
                                </div>
                            </div>

                            <div class="w-full text-center px-1">
                                <p class="text-[12px] font-bold text-slate-800 truncate leading-tight">{{ item.name }}</p>
                                <p class="text-[9px] font-black uppercase tracking-wider mt-1" :class="item.type === 'folder' ? 'text-blue-400' : 'text-slate-400'">
                                    {{ item.type === 'folder' ? 'Folder' : formatSize(item.size) }}
                                </p>
                            </div>

                            <button @click.stop="toggleStar(item)" class="absolute top-2 right-2 p-1.5 bg-white/90 rounded-lg opacity-0 group-hover:opacity-100 transition-opacity shadow-sm">
                                <i :data-lucide="item.is_starred ? 'star-filled' : 'star'" :class="['w-3.5 h-3.5', item.is_starred ? 'text-amber-500 fill-amber-500' : 'text-slate-300']"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div v-if="user" class="lg:hidden fixed bottom-32 right-6 z-40">
                    <button @click.stop="showAddMenu = !showAddMenu" :class="['w-14 h-14 rounded-2xl flex items-center justify-center shadow-2xl transition-all', showAddMenu ? 'bg-slate-900 text-white rotate-45' : 'bg-blue-600 text-white']">
                        <i data-lucide="plus" class="w-6 h-6"></i>
                    </button>
                    <div v-if="showAddMenu" class="absolute bottom-full right-0 mb-4 w-48 glass border border-slate-200 rounded-2xl shadow-2xl p-2 page-enter">
                        <button @click="triggerUpload('file')" class="w-full flex items-center gap-3 p-3 text-sm font-bold text-slate-700">
                            <i data-lucide="file-up" class="w-4 h-4 text-blue-500"></i> ファイル
                        </button>
                        <button @click="triggerUpload('folder')" class="w-full flex items-center gap-3 p-3 text-sm font-bold text-slate-700">
                            <i data-lucide="folder-up" class="w-4 h-4 text-blue-500"></i> フォルダ
                        </button>
                        <button @click="createFolderPrompt" class="w-full flex items-center gap-3 p-3 text-sm font-bold text-blue-600">
                            <i data-lucide="folder-plus" class="w-4 h-4"></i> 新規フォルダ
                        </button>
                    </div>
                </div>

                <nav class="lg:hidden fixed bottom-6 left-6 right-6 h-18 glass rounded-[2rem] border border-slate-200/50 flex items-center justify-around px-4 z-40 shadow-2xl" @contextmenu.stop>
                    <button v-for="nav in navItems" :key="nav.id" @click="currentTab = nav.id; currentFolder = null"
                        :class="['flex flex-col items-center gap-1 transition-all', (currentTab === nav.id && !currentFolder) ? 'text-blue-600 scale-110' : 'text-slate-300']">
                        <i :data-lucide="nav.icon" class="w-6 h-6"></i>
                        <span class="text-[9px] font-black uppercase">{{ nav.label }}</span>
                    </button>
                </nav>
            </main>

            <!-- Preview Modal -->
            <div v-if="previewItem" class="fixed inset-0 z-[1000] dark-glass flex flex-col page-enter">
                <header class="h-24 px-8 flex items-center justify-between text-white border-b border-white/5">
                    <div class="flex items-center gap-4 min-w-0">
                        <button @click="previewItem = null" class="w-10 h-10 flex items-center justify-center bg-white/10 rounded-full hover:bg-white/20">
                            <i data-lucide="chevron-left" class="w-6 h-6"></i>
                        </button>
                        <p class="font-black truncate">{{ previewItem.name }}</p>
                    </div>
                    <div class="flex items-center gap-4">
                        <button v-if="previewItem.url" @click="downloadFile(previewItem)" class="px-6 h-12 bg-white text-black rounded-xl font-bold flex items-center gap-2 btn-hover">
                            <i data-lucide="download" class="w-5 h-5"></i> 保存
                        </button>
                        <button @click="moveToTrash(previewItem)" class="w-12 h-12 bg-rose-500/20 text-rose-400 rounded-xl flex items-center justify-center hover:bg-rose-500 hover:text-white transition-all">
                            <i data-lucide="trash-2" class="w-5 h-5"></i>
                        </button>
                    </div>
                </header>
                <div class="flex-1 flex items-center justify-center p-6 overflow-hidden">
                    <img v-if="isImage(previewItem.type) && previewItem.url" :src="previewItem.url" class="max-w-full max-h-full object-contain rounded-2xl shadow-2xl">
                    <div v-else class="text-center max-w-sm">
                        <div :class="['w-24 h-24 rounded-[2rem] flex items-center justify-center mx-auto mb-8 shadow-2xl', getStyle(previewItem.type).bg]">
                            <i :data-lucide="getStyle(previewItem.type).icon" :class="['w-10 h-10', getStyle(previewItem.type).text]"></i>
                        </div>
                        <h2 class="text-2xl font-black text-white mb-2">{{ previewItem.name }}</h2>
                        <p class="text-slate-400 text-sm font-bold mb-8">{{ formatSize(previewItem.size) }}</p>
                        <button @click="previewItem = null" class="px-10 py-4 bg-white/10 rounded-xl font-bold text-white w-full border border-white/10">閉じる</button>
                    </div>
                </div>
            </div>

            <!-- Folder Creator -->
            <div v-if="folderPromptVisible" class="fixed inset-0 z-[3000] flex items-center justify-center p-6 bg-slate-900/40 backdrop-blur-sm">
                <div class="w-full max-w-sm bg-white rounded-[2rem] p-8 shadow-2xl page-enter" @click.stop>
                    <h3 class="text-lg font-black text-slate-900 mb-6 flex items-center gap-2">
                        <i data-lucide="folder-plus" class="w-5 h-5 text-blue-600"></i>
                        新しいフォルダ
                    </h3>
                    <input v-model="newFolderName" @keyup.enter="confirmCreateFolder" type="text" placeholder="名前を入力..." class="w-full p-4 bg-slate-50 border border-slate-100 rounded-xl mb-8 outline-none focus:border-blue-500 font-bold" autofocus>
                    <div class="flex gap-4">
                        <button @click="folderPromptVisible = false" class="flex-1 py-3 text-slate-400 font-bold hover:text-slate-900">キャンセル</button>
                        <button @click="confirmCreateFolder" class="flex-1 py-3 bg-blue-600 text-white font-bold rounded-xl btn-hover">作成</button>
                    </div>
                </div>
            </div>

            <transition name="fade">
                <div v-if="statusMessage" class="fixed top-8 left-1/2 -translate-x-1/2 dark-glass text-white px-6 py-3 rounded-full shadow-2xl z-[1500] flex items-center gap-3 border border-white/5">
                    <div class="loader scale-50 border-white/20 border-t-white"></div>
                    <span class="text-[10px] font-black uppercase tracking-widest">{{ statusMessage }}</span>
                </div>
            </transition>

            <input type="file" ref="fileInput" class="hidden" @change="handleFileUpload" multiple>
            <input type="file" ref="folderInput" class="hidden" @change="handleFileUpload" webkitdirectory directory multiple>
        </template>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, doc, updateDoc, deleteDoc, serverTimestamp, getDoc } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
        import { createApp, ref, computed, onMounted, nextTick, watch } from "https://unpkg.com/vue@3/dist/vue.esm-browser.prod.js";

        const AUTH_WORKER_URL = "https://noppo-auth.noppo5319.workers.dev";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2YXZhc3JkeGd1cWtpaWdjeGtsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc0MTk5ODcsImV4cCI6MjA4Mjk5NTk4N30.CVq3lyRbxek7Ejs4tP5sN9-0JNEXSLtCsC2Pj-skFFQ";
        
        const CLOUDINARY_CLOUD_NAME = "daiywtxmw";
        const CLOUDINARY_UPLOAD_PRESET = "noppo_preset";

        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyAwe9BsUFXA4MdzYYuekNsLo320MHqfXww",
            authDomain: "tribal-bonsai-470002-u0.firebaseapp.com",
            projectId: "tribal-bonsai-470002-u0",
            storageBucket: "tribal-bonsai-470002-u0.firebasestorage.app",
            appId: "1:189688737908:web:f3281eab70669b5796e121"
        };
        const APP_ID = typeof __app_id !== 'undefined' ? __app_id : 'noppo-drive-ultimate';

        createApp({
            setup() {
                const user = ref(null);
                const items = ref([]);
                const loading = ref(true);
                const authLoading = ref(true);
                const currentTab = ref('all');
                const searchQuery = ref('');
                const previewItem = ref(null);
                const fileInput = ref(null);
                const folderInput = ref(null);
                const statusMessage = ref("");
                const showAddMenu = ref(false);
                const isDragging = ref(false);
                const contextMenu = ref({ show: false, x: 0, y: 0, item: null });
                
                const currentFolder = ref(null);
                const folderPath = ref([]); 
                const folderPromptVisible = ref(false);
                const newFolderName = ref('');

                const navItems = [
                    { id: 'all', label: 'All Files', icon: 'layers' },
                    { id: 'starred', label: 'Starred', icon: 'star' },
                    { id: 'trash', label: 'Trash', icon: 'trash-2' }
                ];

                const app = initializeApp(firebaseConfig);
                const db = getFirestore(app);
                const auth = getAuth(app);

                async function loadNoppoUser() {
                    const params = new URLSearchParams(window.location.search);
                    const ticket = params.get('ticket');
                    try {
                        const url = ticket ? `${AUTH_WORKER_URL}/auth/v1/user?ticket=${ticket}` : `${AUTH_WORKER_URL}/auth/v1/user`;
                        const res = await fetch(url, { headers: { "apikey": SUPABASE_KEY } });
                        if (res.ok) {
                            const data = await res.json();
                            const profile = {
                                userId: data.user_metadata?.display_name || data.email?.split('@')[0] || 'User',
                                avatar: data.user_metadata?.avatar_url,
                                uid: data.id
                            };
                            if (ticket) window.history.replaceState({}, '', window.location.origin + window.location.pathname);
                            localStorage.setItem('noppo_user_profile', JSON.stringify(profile));
                            return profile;
                        }
                    } catch (e) {}
                    const cached = localStorage.getItem('noppo_user_profile');
                    return cached ? JSON.parse(cached) : null;
                }

                const filteredItems = computed(() => {
                    let res = items.value;
                    if (currentTab.value === 'starred') res = res.filter(i => i.is_starred && !i.is_deleted);
                    else if (currentTab.value === 'trash') res = res.filter(i => i.is_deleted);
                    else {
                        res = res.filter(i => !i.is_deleted);
                        if (!searchQuery.value) {
                            const currentId = currentFolder.value?.id || null;
                            res = res.filter(i => (currentId === null) ? !i.parentId : i.parentId === currentId);
                        }
                    }
                    if (searchQuery.value) {
                        const q = searchQuery.value.toLowerCase();
                        res = res.filter(i => i.name.toLowerCase().includes(q));
                    }
                    return res;
                });

                const currentDisplayTitle = computed(() => {
                    if (currentFolder.value) return currentFolder.value.name;
                    return navItems.find(n => n.id === currentTab.value)?.label;
                });

                onMounted(async () => {
                    user.value = await loadNoppoUser();
                    authLoading.value = false;
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (err) { await signInAnonymously(auth); }
                    onAuthStateChanged(auth, (fbUser) => { if (fbUser) startSync(); else loading.value = false; });
                });

                function startSync() {
                    const col = collection(db, 'artifacts', APP_ID, 'public', 'data', 'items');
                    onSnapshot(col, (snap) => {
                        items.value = snap.docs.map(d => ({ id: d.id, ...d.data() }))
                                          .sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
                        loading.value = false;
                        nextTick(() => lucide.createIcons());
                    }, (err) => console.error("Firestore Error:", err));
                }

                watch(currentFolder, (newVal) => {
                    if (!newVal) { folderPath.value = []; return; }
                    const path = [];
                    let current = newVal;
                    while (current && current.parentId) {
                        const parent = items.value.find(i => i.id === current.parentId);
                        if (parent) { path.unshift(parent); current = parent; } else break;
                    }
                    folderPath.value = path;
                });

                // Context Menu Handlers
                const onItemContextMenu = (e, item) => {
                    closeContextMenu();
                    nextTick(() => {
                        contextMenu.value = {
                            show: true,
                            x: e.clientX,
                            y: e.clientY,
                            item: item
                        };
                    });
                };

                const onEmptyContextMenu = (e) => {
                    closeContextMenu();
                    nextTick(() => {
                        contextMenu.value = {
                            show: true,
                            x: e.clientX,
                            y: e.clientY,
                            item: null
                        };
                    });
                };

                const closeContextMenu = () => {
                    contextMenu.value.show = false;
                    showAddMenu.value = false;
                };

                // Drag & Drop
                const onDragOver = () => { isDragging.value = true; };
                const onDragLeave = () => { isDragging.value = false; };
                const onDrop = async (e) => {
                    isDragging.value = false;
                    const files = e.dataTransfer.files;
                    if (files.length > 0) {
                        await handleFiles(Array.from(files));
                    }
                };

                const handleItemClick = (item) => {
                    closeContextMenu();
                    if (item.type === 'folder') {
                        currentFolder.value = item;
                        currentTab.value = 'all';
                    } else {
                        previewItem.value = item;
                    }
                };

                const triggerUpload = (type) => {
                    closeContextMenu();
                    if (type === 'file') fileInput.value.click();
                    else if (type === 'folder') folderInput.value.click();
                };

                const createFolderPrompt = () => {
                    closeContextMenu();
                    newFolderName.value = '';
                    folderPromptVisible.value = true;
                };

                const confirmCreateFolder = async () => {
                    if (!newFolderName.value.trim()) return;
                    folderPromptVisible.value = false;
                    const itemsCol = collection(db, 'artifacts', APP_ID, 'public', 'data', 'items');
                    await addDoc(itemsCol, {
                        name: newFolderName.value,
                        type: 'folder',
                        parentId: currentFolder.value?.id || null,
                        is_deleted: false,
                        is_starred: false,
                        createdAt: serverTimestamp(),
                        ownerId: user.value?.uid || auth.currentUser.uid
                    });
                };

                const handleFileUpload = async (e) => {
                    const files = Array.from(e.target.files);
                    await handleFiles(files);
                    e.target.value = '';
                };

                const handleFiles = async (files) => {
                    if (!auth.currentUser) return;
                    for (const file of files) {
                        statusMessage.value = `UP: ${file.name.slice(0, 10)}...`;
                        try {
                            const itemsCol = collection(db, 'artifacts', APP_ID, 'public', 'data', 'items');
                            const docRef = await addDoc(itemsCol, {
                                name: file.name,
                                size: file.size,
                                type: file.type || 'application/octet-stream',
                                url: "",
                                public_id: "", // Cloudinary ID for deletion
                                parentId: currentFolder.value?.id || null,
                                is_deleted: false,
                                is_starred: false,
                                processing: true,
                                createdAt: serverTimestamp(),
                                ownerId: user.value?.uid || auth.currentUser.uid
                            });

                            const formData = new FormData();
                            formData.append('file', file);
                            formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
                            const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`, { method: 'POST', body: formData });
                            const result = await res.json();
                            
                            const itemRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'items', docRef.id);
                            await updateDoc(itemRef, { 
                                url: result.secure_url, 
                                public_id: result.public_id,
                                processing: false 
                            });
                        } catch (err) {
                            console.error("Upload Error:", err);
                        }
                    }
                    statusMessage.value = "";
                };

                const toggleStar = async (item) => {
                    closeContextMenu();
                    const ref = doc(db, 'artifacts', APP_ID, 'public', 'data', 'items', item.id);
                    await updateDoc(ref, { is_starred: !item.is_starred });
                };

                const moveToTrash = async (item) => {
                    closeContextMenu();
                    const ref = doc(db, 'artifacts', APP_ID, 'public', 'data', 'items', item.id);
                    await updateDoc(ref, { is_deleted: true });
                    previewItem.value = null;
                };

                const restoreFromTrash = async (item) => {
                    closeContextMenu();
                    const ref = doc(db, 'artifacts', APP_ID, 'public', 'data', 'items', item.id);
                    await updateDoc(ref, { is_deleted: false });
                };

                const permanentlyDelete = async (item) => {
                    closeContextMenu();
                    const confirmMsg = item.type === 'folder' 
                        ? `フォルダ「${item.name}」を完全に削除しますか？中身は消えませんが、アクセスできなくなります。`
                        : `「${item.name}」を完全に削除します。この操作は取り消せません。`;
                    
                    if (!confirm(confirmMsg)) return;

                    statusMessage.value = "DELETING...";
                    try {
                        // 1. Cloudinaryからの削除 (ファイルの場合のみ)
                        if (item.type !== 'folder' && item.public_id) {
                            // フロントエンドからの直接削除はCloudinaryの制限がある場合が多いが、一応実行。
                            // 失敗してもFirestore側は消す。
                            try {
                                const formData = new FormData();
                                formData.append('public_id', item.public_id);
                                formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
                                await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/delete_by_token`, { 
                                    method: 'POST', 
                                    body: formData 
                                });
                            } catch (e) {
                                console.warn("Cloudinary delete failed, skipping to Firestore delete.");
                            }
                        }

                        // 2. Firestoreからの削除
                        const ref = doc(db, 'artifacts', APP_ID, 'public', 'data', 'items', item.id);
                        await deleteDoc(ref);
                    } catch (err) {
                        console.error("Delete Error:", err);
                    }
                    statusMessage.value = "";
                    previewItem.value = null;
                };

                const downloadFile = (item) => {
                    closeContextMenu();
                    if (item.url) window.open(item.url, '_blank');
                };

                watch([items, currentTab, currentFolder, previewItem, showAddMenu, folderPromptVisible, contextMenu, isDragging], () => {
                    nextTick(() => lucide.createIcons());
                }, { deep: true });

                return {
                    user, items, filteredItems, currentTab, searchQuery, previewItem, loading, authLoading,
                    statusMessage, fileInput, folderInput, navItems, currentDisplayTitle,
                    currentFolder, folderPath, folderPromptVisible, newFolderName, showAddMenu,
                    isDragging, contextMenu,
                    onDragOver, onDragLeave, onDrop, closeContextMenu, onItemContextMenu, onEmptyContextMenu,
                    goToLogin: () => window.location.href = `${AUTH_WORKER_URL}?redirect=${encodeURIComponent(window.location.href)}`,
                    logout: () => {
                        localStorage.removeItem('noppo_user_profile');
                        window.location.href = `${AUTH_WORKER_URL}/logout?redirect=${encodeURIComponent(window.location.href)}`;
                    },
                    triggerUpload, createFolderPrompt, confirmCreateFolder, handleFileUpload, handleItemClick,
                    isImage: (t) => t?.startsWith('image/'),
                    formatSize: (b) => b ? (b/1024/1024).toFixed(1) + ' MB' : '0 B',
                    downloadFile, toggleStar, moveToTrash, restoreFromTrash, permanentlyDelete,
                    getStyle: (t) => {
                        if (t?.includes('pdf')) return { bg: 'bg-rose-100', text: 'text-rose-600', icon: 'file-text' };
                        if (t?.includes('zip')) return { bg: 'bg-amber-100', text: 'text-amber-600', icon: 'archive' };
                        if (t?.includes('video')) return { bg: 'bg-purple-100', text: 'text-purple-600', icon: 'video' };
                        return { bg: 'bg-blue-50', text: 'text-blue-500', icon: 'file' };
                    }
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
